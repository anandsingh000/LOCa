services:
  - type: web
    name: live-option-chain
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT main:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LOCA_SECRET_KEY
        generateValue: true
      - key: LOCA_COOKIE_SECURE
        value: "true"
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: UPSTOX_EXPIRY
        value: nearest
