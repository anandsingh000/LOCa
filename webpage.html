<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        h1 {
            color: whitesmoke;
            text-align: center;
            margin: 16px 0;
        }

        body {
            margin: 0;
            min-width: 320px;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .index-button {
            height: 60px;
            width: 140px;
            background: rgb(111, 224, 220);
            border-width: 7px;
            border-color: mediumseagreen;
            border-radius: 15px;
            cursor: pointer;
        }

        .index-button:active {
            animation-duration: 2s;
            background: rgb(51, 183, 176);
            color: whitesmoke;
        }

        #put_call_ratio {
            list-style-type: none;
            align-self: left;
            color: whitesmoke; 
            position: relative;
            padding: 0;
            margin: 12px auto;
            max-width: 1100px;
        }

        #put_call_ratio {
            width: 100%;
            display: table;
            table-layout: fixed;
        }

        #put_call_ratio li {
            display: table-cell;
            width: auto;
            text-align: center;
            padding: 4px 8px;
        }

        #optionChainTable {
            box-sizing: border-box;
            height: min(800px, calc(100vh - 260px));
            min-height: 280px;
            width: calc(100% - 20px);
            max-width: 100vw;
            margin: 0 10px;
            overflow: auto;
            background: #f9f9ff;
            border: 1px solid rgba(0, 0, 0, 0.25);
            border-radius: 6px;
        }

        /* The generated pandas table can be wider than the screen. The
           wrapper scrolls horizontally while the user resizes columns. */
        #optionChainTable table {
            table-layout: fixed;
            width: max-content;
            min-width: 100%;
            border-collapse: collapse;
        }

        #optionChainTable table th,
        #optionChainTable table td {
            box-sizing: border-box;
        }

        #optionChainTable table th {
            position: relative;
            overflow: visible;
            white-space: nowrap;
        }

        #optionChainTable table td {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #optionChainTable table tbody tr {
            cursor: pointer;
        }

        #optionChainTable table tbody tr:hover td,
        #optionChainTable table tbody tr:hover th {
            background-color: #fff8d6 !important;
        }

        #optionChainTable table tbody tr.option-chain-row-selected td,
        #optionChainTable table tbody tr.option-chain-row-selected th {
            background-color: #ffe066 !important;
            box-shadow: inset 0 2px 0 #b8860b, inset 0 -2px 0 #b8860b;
        }

        .column-resize-handle {
            position: absolute;
            z-index: 5;
            top: 0;
            right: -4px;
            width: 8px;
            height: 100%;
            padding: 0;
            border: 0;
            background: transparent;
            cursor: col-resize;
            touch-action: none;
        }

        .column-resize-handle:hover,
        .column-resize-handle:focus-visible {
            background: rgba(0, 105, 92, 0.55);
            outline: none;
        }

        body.is-resizing,
        body.is-resizing * {
            cursor: col-resize !important;
            user-select: none !important;
        }

        #table-tools {
            display: none;
            box-sizing: border-box;
            width: calc(100% - 20px);
            margin: 8px 10px 0;
            color: whitesmoke;
            font-size: 0.92rem;
            text-align: right;
        }

        #table-tools button {
            margin-left: 10px;
            padding: 5px 10px;
            border: 1px solid mediumseagreen;
            border-radius: 5px;
            background: rgb(111, 224, 220);
            cursor: pointer;
        }

        #live-status, #quote-status {
            box-sizing: border-box;
            width: calc(100% - 20px);
            margin: 8px 10px;
            min-height: 24px;
            color: whitesmoke;
            text-align: right;
            font-size: 0.9rem;
        }

        #upstox-controls {
            box-sizing: border-box;
            width: calc(100% - 20px);
            margin: 8px 10px;
            color: whitesmoke;
            text-align: center;
        }

        #upstox-status {
            margin-right: 8px;
        }

        #upstox-controls button {
            padding: 5px 10px;
            border: 1px solid mediumseagreen;
            border-radius: 5px;
            background: rgb(111, 224, 220);
            cursor: pointer;
        }

        #upstox-controls button[hidden] {
            display: none;
        }

        #upstox-controls button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        #refreshData {
            margin-left: 10px;
            padding: 5px 10px;
            border: 1px solid mediumseagreen;
            border-radius: 5px;
            background: rgb(111, 224, 220);
            cursor: pointer;
        }

        .strike-level-value {
            font-weight: 700;
            line-height: 1.1;
        }

        .strike-level-badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2px;
            margin-top: 4px;
        }

        .strike-level-badge {
            display: inline-block;
            padding: 2px 4px;
            border-radius: 3px;
            color: #111;
            font-size: 0.66rem;
            font-weight: 700;
            line-height: 1.1;
        }

        .strike-level-atm { background: #ffe066; }
        .strike-level-support { background: #8ce99a; }
        .strike-level-resistance { background: #ffa8a8; }
        .strike-level-maxpain { background: #d0bfff; }
    </style>
</head>

<body bgcolor="darkcyan">
    <h1>Option Chain Analysis</h1>

    <script>

        const MIN_COLUMN_WIDTH = 64;
        const MAX_INITIAL_COLUMN_WIDTH = 320;
        const COLUMN_WIDTHS_PREFIX = "loca-column-widths-v1:";
        const AUTO_REFRESH_MS = 5000;
        let activeTable = null;
        let activeTableIndex = null;
        let activeIndex = null;
        let snapshotRequestNumber = 0;
        let autoRefreshTimer = null;
        let selectedStrikeKey = null;
        let quotesRequest = null;
        let snapshotLoading = false;

        function renderPcr(items) {
            const html = (items || []).map((item) =>
                "<li><b>" + item[3] + "</b><br><b>Call: </b>" + item[1] +
                "<br><b>Put: </b>" + item[0] + "<br><b>Ratio: </b>" +
                item[2] + "</li>"
            ).join("");
            document.getElementById("put_call_ratio").innerHTML = html ||
                "<li>Live PCR data is temporarily unavailable.</li>";
        }

        function fetchQuotes() {
            if (quotesRequest) {
                return quotesRequest;
            }
            quotesRequest = fetch("/quotes", { cache: "no-store" })
                .then((response) => {
                    if (!response.ok) {
                        throw new Error("Unable to load index values");
                    }
                    return response.json();
                })
                .then((payload) => {
                    const values = payload.values || {};
                    ["NIFTY", "BANKNIFTY", "FINNIFTY", "SENSEX"].forEach((index) => {
                        const target = document.getElementById(
                            index === "NIFTY" ? "nifty_value" :
                            index === "BANKNIFTY" ? "banknifty_value" :
                            index === "FINNIFTY" ? "finnifty_value" :
                            "sensex_value"
                        );
                        if (!target) {
                            return;
                        }
                        target.textContent = values[index] ||
                            payload.sources?.[index] || "Unavailable";
                    });
                    const sourceLabels = Object.entries(payload.sources || {})
                        .map(([index, source]) => index + ": " + source);
                    if (sourceLabels.length) {
                        document.getElementById("quote-status").textContent =
                            sourceLabels.join(" · ");
                    }
                    return payload;
                })
                .catch(() => {
                    document.getElementById("quote-status").textContent =
                        "Live quote update is temporarily unavailable.";
                })
                .finally(() => {
                    quotesRequest = null;
                });
            return quotesRequest;
        }

        function updateUpstoxStatus() {
            return fetch("/upstox/status", { cache: "no-store" })
                .then((response) => {
                    if (!response.ok) {
                        throw new Error("Unable to load connection status");
                    }
                    return response.json();
                })
                .then((status) => {
                    const statusTarget = document.getElementById("upstox-status");
                    const connectButton = document.getElementById("connectUpstox");
                    const disconnectButton = document.getElementById("disconnectUpstox");
                    statusTarget.textContent = status.message ||
                        "Upstox connection status unavailable.";
                    connectButton.hidden = !status.can_connect || status.connected;
                    disconnectButton.hidden = !status.can_disconnect;
                    return status;
                })
                .catch(() => {
                    document.getElementById("upstox-status").textContent =
                        "Unable to check Upstox connection status.";
                });
        }

        function disconnectUpstox() {
            return fetch("/upstox/disconnect", {
                method: "POST",
                headers: { "Content-Type": "application/json" }
            })
                .then((response) => {
                    if (!response.ok) {
                        throw new Error("Unable to disconnect Upstox");
                    }
                    return updateUpstoxStatus();
                })
                .then(() => {
                    fetchQuotes();
                    if (activeIndex) {
                        fetchTable(activeIndex);
                    }
                })
                .catch((error) => setLiveStatus(error.message, true));
        }

        function widthStorageKey(index) {
            return COLUMN_WIDTHS_PREFIX + index;
        }

        function getColumnLabel(header, columnIndex) {
            const label = header.textContent.replace(/\s+/g, " ").trim();
            return label || "column-" + columnIndex;
        }

        function loadSavedWidths(index) {
            try {
                return JSON.parse(localStorage.getItem(widthStorageKey(index))) || {};
            } catch (error) {
                return {};
            }
        }

        function saveWidths(index, table) {
            if (!index || !table) {
                return;
            }

            const headers = Array.from(table.querySelectorAll("thead th"));
            const widths = {};
            headers.forEach((header, columnIndex) => {
                const column = table.querySelector(
                    "col[data-column-index='" + columnIndex + "']"
                );
                if (column) {
                    widths[columnIndex + ":" + getColumnLabel(header, columnIndex)] =
                        Math.round(parseFloat(column.style.width));
                }
            });

            try {
                localStorage.setItem(widthStorageKey(index), JSON.stringify(widths));
            } catch (error) {
                // Private browsing or disabled storage should not block resizing.
            }
        }

        function setColumnWidth(table, columnIndex, width) {
            const column = table.querySelector(
                "col[data-column-index='" + columnIndex + "']"
            );
            if (!column) {
                return;
            }

            const safeWidth = Math.max(MIN_COLUMN_WIDTH, Math.round(width));
            column.style.width = safeWidth + "px";

            const columns = Array.from(table.querySelectorAll("col"));
            const totalWidth = columns.reduce((total, currentColumn) => {
                return total + (parseFloat(currentColumn.style.width) || 0);
            }, 0);
            table.style.width = Math.max(totalWidth, table.parentElement.clientWidth) + "px";
        }

        function resizeColumn(event, table, columnIndex, handle) {
            if (event.button !== undefined && event.button !== 0) {
                return;
            }

            event.preventDefault();
            const column = table.querySelector(
                "col[data-column-index='" + columnIndex + "']"
            );
            if (!column) {
                return;
            }

            const startingWidth = parseFloat(column.style.width) ||
                table.querySelectorAll("thead th")[columnIndex].getBoundingClientRect().width;
            const startingX = event.clientX;
            document.body.classList.add("is-resizing");
            handle.setPointerCapture?.(event.pointerId);

            function move(pointerEvent) {
                setColumnWidth(
                    table,
                    columnIndex,
                    startingWidth + pointerEvent.clientX - startingX
                );
                handle.setAttribute("aria-valuenow", Math.round(
                    parseFloat(column.style.width)
                ));
            }

            function stop() {
                document.body.classList.remove("is-resizing");
                window.removeEventListener("pointermove", move);
                window.removeEventListener("pointerup", stop);
                window.removeEventListener("pointercancel", stop);
                saveWidths(activeTableIndex, table);
            }

            window.addEventListener("pointermove", move);
            window.addEventListener("pointerup", stop);
            window.addEventListener("pointercancel", stop);
        }

        function setupResizableColumns(index) {
            const container = document.getElementById("optionChainTable");
            const table = container.querySelector("table");
            if (!table) {
                return;
            }

            const headers = Array.from(table.querySelectorAll("thead th"));
            if (!headers.length) {
                return;
            }

            let colgroup = table.querySelector("colgroup");
            if (!colgroup) {
                colgroup = document.createElement("colgroup");
                table.insertBefore(colgroup, table.firstChild);
            }
            colgroup.innerHTML = "";

            const savedWidths = loadSavedWidths(index);
            const widths = headers.map((header, columnIndex) => {
                const label = getColumnLabel(header, columnIndex);
                const savedWidth = Number(savedWidths[
                    columnIndex + ":" + label
                ]);
                const naturalWidth = Math.min(
                    MAX_INITIAL_COLUMN_WIDTH,
                    Math.max(MIN_COLUMN_WIDTH, header.scrollWidth + 18)
                );
                return Number.isFinite(savedWidth) && savedWidth >= MIN_COLUMN_WIDTH
                    ? savedWidth
                    : naturalWidth;
            });

            headers.forEach((header, columnIndex) => {
                const column = document.createElement("col");
                column.dataset.columnIndex = columnIndex;
                column.style.width = widths[columnIndex] + "px";
                colgroup.appendChild(column);

                const oldHandle = header.querySelector(".column-resize-handle");
                oldHandle?.remove();

                const handle = document.createElement("button");
                handle.type = "button";
                handle.className = "column-resize-handle";
                handle.title = "Drag to resize this column";
                handle.setAttribute("aria-label", "Resize " +
                    getColumnLabel(header, columnIndex) + " column");
                handle.setAttribute("aria-valuemin", MIN_COLUMN_WIDTH);
                handle.setAttribute("aria-valuenow", widths[columnIndex]);
                handle.setAttribute("aria-orientation", "vertical");
                handle.addEventListener("pointerdown", (event) => {
                    resizeColumn(event, table, columnIndex, handle);
                });
                handle.addEventListener("keydown", (event) => {
                    if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") {
                        return;
                    }
                    event.preventDefault();
                    const direction = event.key === "ArrowRight" ? 12 : -12;
                    setColumnWidth(
                        table,
                        columnIndex,
                        parseFloat(column.style.width) + direction
                    );
                    handle.setAttribute("aria-valuenow", Math.round(
                        parseFloat(column.style.width)
                    ));
                    saveWidths(index, table);
                });
                header.appendChild(handle);
            });

            table.style.tableLayout = "fixed";
            const totalWidth = widths.reduce((total, width) => total + width, 0);
            table.style.width = Math.max(totalWidth, container.clientWidth) + "px";
            activeTable = table;
            activeTableIndex = index;
            document.getElementById("table-tools").style.display = "block";
        }

        function getStrikeColumnIndex(table) {
            return Array.from(table.querySelectorAll("thead th")).findIndex(
                (header) => header.textContent.trim().toUpperCase() === "STRIKE"
            );
        }

        function getRowStrikeKey(row, table) {
            const strikeColumnIndex = getStrikeColumnIndex(table);
            if (strikeColumnIndex < 0 || !row.children[strikeColumnIndex]) {
                return null;
            }
            const text = row.children[strikeColumnIndex].textContent.trim();
            const number = text.match(/[0-9][0-9,]*/);
            return number ? number[0].replace(/,/g, "") : text;
        }

        function selectOptionChainRow(row, table) {
            table.querySelectorAll("tbody tr.option-chain-row-selected")
                .forEach((selectedRow) => {
                    selectedRow.classList.remove("option-chain-row-selected");
                    selectedRow.setAttribute("aria-selected", "false");
                });
            row.classList.add("option-chain-row-selected");
            row.setAttribute("aria-selected", "true");
            selectedStrikeKey = getRowStrikeKey(row, table);
        }

        function enableRowSelection() {
            const table = document.querySelector("#optionChainTable table");
            if (!table) {
                return;
            }

            table.querySelectorAll("tbody tr").forEach((row) => {
                row.setAttribute("aria-selected", "false");
                row.addEventListener("click", () => {
                    selectOptionChainRow(row, table);
                });
                row.addEventListener("keydown", (event) => {
                    if (event.key === "Enter" || event.key === " ") {
                        event.preventDefault();
                        selectOptionChainRow(row, table);
                    }
                });
                row.tabIndex = 0;

                if (selectedStrikeKey &&
                    getRowStrikeKey(row, table) === selectedStrikeKey) {
                    selectOptionChainRow(row, table);
                }
            });
        }

        function resetColumnWidths() {
            if (!activeTable || !activeTableIndex) {
                return;
            }
            try {
                localStorage.removeItem(widthStorageKey(activeTableIndex));
            } catch (error) {
                // Ignore disabled local storage.
            }
            setupResizableColumns(activeTableIndex);
        }

        function setLiveStatus(message, showRefresh = false) {
            const target = document.getElementById("live-status");
            target.textContent = message;
            if (showRefresh) {
                const button = document.createElement("button");
                button.id = "refreshData";
                button.type = "button";
                button.textContent = "Refresh now";
                button.addEventListener("click", () => fetchTable(activeIndex));
                target.appendChild(button);
            }
        }

        function formatUpdatedAt(snapshot) {
            const source = snapshot.source_timestamp || snapshot.updated_at;
            if (!source) {
                return "Updated just now";
            }
            return (snapshot.source || "Live") + " data: " + source;
        }

        function fetchTable(endpoint, options = {}) {
            if (options.silent && snapshotLoading) {
                return;
            }
            const container = document.getElementById("optionChainTable");
            if (activeIndex !== endpoint) {
                selectedStrikeKey = null;
                activeTable = null;
                activeTableIndex = null;
                container.textContent = "Loading " + endpoint + " option chain...";
                document.getElementById("put_call_ratio").textContent = "";
                document.getElementById("table-tools").style.display = "none";
            }
            activeIndex = endpoint;
            snapshotLoading = true;
            const requestNumber = ++snapshotRequestNumber;
            const silent = options.silent === true;
            if (!silent) {
                setLiveStatus("Loading " + endpoint + " data...");
            } else {
                setLiveStatus("Refreshing " + endpoint + " data...");
            }

            const request = fetch("/snapshot/" + endpoint, { cache: "no-store" })
                .then(async (response) => {
                    const payload = await response.json();
                    if (!response.ok) {
                        throw new Error(payload.error || "Unable to load option chain");
                    }
                    return payload;
                })
                .then((snapshot) => {
                    if (requestNumber !== snapshotRequestNumber) {
                        return;
                    }
                    const scrollTop = container.scrollTop;
                    const scrollLeft = container.scrollLeft;
                    container.innerHTML = snapshot.table_html;
                    setupResizableColumns(endpoint);
                    enableRowSelection();
                    container.scrollTop = scrollTop;
                    container.scrollLeft = scrollLeft;
                    renderPcr(snapshot.pcr);
                    setLiveStatus(
                        formatUpdatedAt(snapshot) +
                        (snapshot.expiry ? " · expiry " + snapshot.expiry : "") +
                        " · auto-refresh every " + (AUTO_REFRESH_MS / 1000) +
                        " seconds", true
                    );
                })
                .catch((error) => {
                    if (requestNumber !== snapshotRequestNumber) {
                        return;
                    }
                    const showingPrevious = activeTableIndex === endpoint;
                    if (!showingPrevious) {
                        container.textContent = error.message;
                    }
                    setLiveStatus(
                        (showingPrevious ? "Showing last successful table. " : "") +
                        error.message, true
                    );
                })
                .finally(() => {
                    if (requestNumber === snapshotRequestNumber) {
                        snapshotLoading = false;
                    }
                });
            if (options.skipQuotes !== true) {
                fetchQuotes();
            }
            return request;
        }

        function startAutoRefresh() {
            window.clearInterval(autoRefreshTimer);
            autoRefreshTimer = window.setInterval(() => {
                fetchQuotes();
                if (activeIndex) {
                    fetchTable(activeIndex, { silent: true, skipQuotes: true });
                }
            }, AUTO_REFRESH_MS);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("resetColumnWidths").addEventListener(
                "click", resetColumnWidths
            );
            fetchQuotes();
            updateUpstoxStatus();
            document.getElementById("disconnectUpstox").addEventListener(
                "click", disconnectUpstox
            );
            startAutoRefresh();
        });
    </script>

        <center>
            <button onclick="fetchTable('NIFTY');" class="index-button">
                <b>NIFTY</b> <br> <div id="nifty_value"></div>
            </button>
            <button onclick="fetchTable('BANKNIFTY')" class="index-button">
                <b>BANKNIFTY</b> <br> <div id="banknifty_value"></div>
            </button>
            <button onclick="fetchTable('FINNIFTY')" class="index-button">
                <b>FINNIFTY</b> <br> <div id="finnifty_value"></div>
            </button>
            <button onclick="fetchTable('SENSEX')" class="index-button">
                <b>SENSEX</b> <br> <div id="sensex_value"></div>
            </button>
          <br>
          <br>
            <ul id="put_call_ratio">
            </ul>
        </center>

    <div id="upstox-controls" role="status" aria-live="polite">
        <span id="upstox-status">Checking Upstox connection...</span>
        <button id="connectUpstox" type="button" hidden
            onclick="window.location.href='/upstox/connect'">
            Connect Upstox
        </button>
        <button id="disconnectUpstox" type="button" hidden>
            Disconnect
        </button>
    </div>
    <div id="quote-status" role="status" aria-live="polite"></div>
    
  <br>
  <br>
    <div id="optionChainTable" style="display:block"></div>
    <div id="live-status" role="status" aria-live="polite">
        Select an index to load live option-chain data.
    </div>
    <div id="table-tools">
        Drag the border on any column heading to resize it.
        <button id="resetColumnWidths" type="button">Reset column widths</button>
    </div>
    <br>
    <br>
</body>

</html>
